callout_class_by_marker:
  "[!NOTE]": note
  "[!TIP]": tip
  "[!IMPORTANT]": important
  "[!WARNING]": warning
  "[!CAUTION]": caution

map_marker: "[!MAP]"

coordinate:
  signs: "+-"
  digits: "0123456789"
  point: "."
  latitude_within: "90"
  longitude_within: "180"

blanks: " \t\n\v\f\r"

ref_schemes:
  - page
  - block
